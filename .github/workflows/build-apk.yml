name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Master Integration of All DGMS Modules into MINEGUARD AI
        run: |
          mkdir -p www
          python - << 'PYEOF'
          import sys

          # 1. Base Core Dashboard Import
          try:
              from ui import DASHBOARD_HTML as html
          except Exception:
              from ui_part1 import PART1
              from ui_part2 import PART2
              from ui_part3 import PART3
              try:
                  from ui_map import PART_MAP
              except Exception:
                  PART_MAP = ""
              html = PART1 + PART_MAP + PART3 + PART2

          # 2. Universal Branding Enforcement
          for token in ["MinePulse AI", "MinePulse", "MINEPULSE"]:
              html = html.replace(token, "MINEGUARD AI")

          html = html.replace("fetch('/api/", "fetch('https://minepulse-app.onrender.com/api/")
          html = html.replace('fetch("/api/', 'fetch("https://minepulse-app.onrender.com/api/')

          # 3. Dynamic Standalone Modules Injection Registry
          modules = [
              ("ui_sync", "SYNC_SCRIPT"),
              ("ui_handover", "HANDOVER_MODULE"),
              ("ui_alerts", "ALERTS_MODULE"),
              ("ui_pdf", "PDF_ENGINE_MODULE"),
              ("ui_muster", "MUSTER_MODULE"),
              ("ui_ventilation", "VENTILATION_MODULE"),
              ("ui_blasting", "BLASTING_MODULE"),
              ("ui_strata", "STRATA_MODULE"),
              ("ui_inundation", "INUNDATION_MODULE"),
              ("ui_machinery", "MACHINERY_MODULE"),
              ("ui_dust", "DUST_MODULE"),
              ("ui_fire", "FIRE_MODULE"),
              ("ui_electrical", "ELECTRICAL_MODULE"),
              ("ui_winding", "WINDING_MODULE"),
              ("ui_rescue", "RESCUE_MODULE"),
          ]

          integrated_scripts = ""
          for mod_name, var_name in modules:
              try:
                  mod = __import__(mod_name)
                  script_content = getattr(mod, var_name, "")
                  integrated_scripts += "\n<!-- Module: " + mod_name + " -->\n" + script_content
                  print(f"[OK] Integrated statutory module: {mod_name}")
              except Exception as err:
                  print(f"[WARN] Module {mod_name} skipped: {err}")

          # 4. Hardware DGMS Sawtooth Siren Audio Engine (Auto-Unlocking)
          siren_engine = """
          <script>
          (function() {
              var audioCtx = null;
              var isSirenPlaying = false;
              var sirenOsc = null;
              var sirenGain = null;

              function getAudioContext() {
                  if (!audioCtx) {
                      var AudioClass = window.AudioContext || window.webkitAudioContext;
                      audioCtx = new AudioClass();
                  }
                  if (audioCtx.state === 'suspended') {
                      audioCtx.resume();
                  }
                  return audioCtx;
              }

              function unlockAudio() {
                  try {
                      var ctx = getAudioContext();
                      if (ctx.state === 'suspended') ctx.resume();
                      var b = ctx.createBuffer(1, 1, 22050);
                      var s = ctx.createBufferSource();
                      s.buffer = b;
                      s.connect(ctx.destination);
                      s.start(0);
                  } catch(e) {}
              }

              window.addEventListener('touchstart', unlockAudio, { once: true });
              window.addEventListener('click', unlockAudio, { once: true });

              window.playDGMSSiren = function(durationMs) {
                  durationMs = durationMs || 10000;
                  try {
                      var ctx = getAudioContext();
                      if (ctx.state === 'suspended') ctx.resume();
                      if (isSirenPlaying) return;
                      isSirenPlaying = true;

                      if (navigator.vibrate) {
                          navigator.vibrate([800, 200, 800, 200, 1200, 300, 1500]);
                      }

                      sirenOsc = ctx.createOscillator();
                      sirenGain = ctx.createGain();
                      sirenOsc.type = 'sawtooth';
                      sirenGain.gain.setValueAtTime(0.01, ctx.currentTime);
                      sirenGain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.3);

                      sirenOsc.connect(sirenGain);
                      sirenGain.connect(ctx.destination);

                      var t = ctx.currentTime;
                      sirenOsc.frequency.setValueAtTime(800, t);

                      var cycle = 2.5;
                      var totalCycles = Math.ceil(durationMs / 1000 / cycle);
                      for (var i = 0; i < totalCycles; i++) {
                          var start = t + (i * cycle);
                          sirenOsc.frequency.exponentialRampToValueAtTime(1200, start + (cycle * 0.6));
                          sirenOsc.frequency.exponentialRampToValueAtTime(800, start + cycle);
                      }

                      sirenOsc.start(t);
                      setTimeout(function() { window.stopDGMSSiren(); }, durationMs);
                  } catch(e) {
                      console.error("Siren fault:", e);
                  }
              };

              window.stopDGMSSiren = function() {
                  if (!isSirenPlaying) return;
                  try {
                      if (sirenGain && audioCtx) {
                          sirenGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                          setTimeout(function() {
                              if (sirenOsc) {
                                  sirenOsc.stop();
                                  sirenOsc.disconnect();
                                  sirenOsc = null;
                              }
                              isSirenPlaying = false;
                          }, 400);
                      } else {
                          if (sirenOsc) { sirenOsc.stop(); sirenOsc = null; }
                          isSirenPlaying = false;
                      }
                      if (navigator.vibrate) navigator.vibrate(0);
                  } catch(e) {
                      isSirenPlaying = false;
                  }
              };

              window.triggerAlarm = function() {
                  window.playDGMSSiren(12000);
              };
          })();
          </script>
          """

          final_html = html.replace('</body>', integrated_scripts + siren_engine + '</body>')

          with open('www/index.html', 'w', encoding='utf-8') as f:
              f.write(final_html)

          print("[SUCCESS] Master index.html packaged with all 15 DGMS modules.")
          PYEOF

      - name: Configure Capacitor Android Engine
        run: |
          npm init -y
          npm install --save @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mineguard.dgms",
            "appName": "MINEGUARD AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android

      - name: Compile Native APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINEGUARD-AI-Production-Complete-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
