name: Build MineGuard Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-native-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper & Build Native APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/MineGuard-DGMS-Native.apk \;
          ls -la output_apk/

      - name: Upload Clean Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineGuard-DGMS-Native-APK
          path: output_apk/*.apk
          retention-days: 7
          
