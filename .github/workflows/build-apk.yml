name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Web App Bundle
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>MinePulse AI</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; padding: 14px; }
              header { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; }
              .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
              .btn-sos { background: #dc2626; color: #fff; font-weight: bold; border: none; padding: 8px 14px; border-radius: 6px; }
              input, select, textarea { width: 100%; background: #020617; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin: 6px 0 10px; }
              .btn-save { width: 100%; background: #f59e0b; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; }
            </style>
          </head>
          <body>
            <header>
              <strong>⛏️ MinePulse AI (Pit Mode)</strong>
              <button onclick="triggerAlarm()" class="btn-sos">🚨 DGMS SOS</button>
            </header>
            <div class="card">
              <div style="font-size:10px; color:#94a3b8;">SECURE DISK VAULT</div>
              <div style="font-size:14px; font-weight:bold; color:#34d399;">Offline Native SQLite Active</div>
            </div>
            <div class="card">
              <h3 style="font-size:12px; margin-bottom:6px;">DGMS Statutory Inspection (CMR 2017)</h3>
              <form onsubmit="saveOffline(event)">
                <select id="cat">
                  <option value="CMR 153">CMR 153: Face Ventilation & Gas</option>
                  <option value="CMR 106">CMR 106: Highwall Bench Stability</option>
                </select>
                <textarea id="notes" rows="3" required placeholder="Log observations..."></textarea>
                <button type="submit" class="btn-save">Sign & Save to Phone</button>
              </form>
            </div>
            <div class="card">
              <div style="font-size:11px; font-weight:bold; margin-bottom:6px;">Local Records</div>
              <div id="log-list" style="font-size:11px; color:#94a3b8;">No records stored yet.</div>
            </div>
            <script>
              var logs = JSON.parse(localStorage.getItem('dgms_logs') || '[]');
              function render() {
                var el = document.getElementById('log-list');
                if (logs.length === 0) { el.innerHTML = 'No records stored yet.'; return; }
                el.innerHTML = logs.map(function(l){
                  return '<div style="background:#020617; border:1px solid #334155; padding:6px; border-radius:4px; margin-bottom:4px;">' +
                    '<b>' + l.cat + '</b>: ' + l.notes + '<div style="color:#f59e0b; font-size:9px;">' + l.seal + '</div></div>';
                }).join('');
              }
              function saveOffline(e) {
                e.preventDefault();
                logs.push({
                  cat: document.getElementById('cat').value,
                  notes: document.getElementById('notes').value,
                  seal: 'SEAL-' + Math.random().toString(36).substring(2, 10).toUpperCase()
                });
                localStorage.setItem('dgms_logs', JSON.stringify(logs));
                document.getElementById('notes').value = '';
                render();
                alert('Saved to local phone vault!');
              }
              function triggerAlarm() {
                if (navigator.vibrate) navigator.vibrate([1000, 300, 1000, 300, 1500]);
                alert('🚨 DGMS STATUTORY EVACUATION ALERT ENGAGED!');
              }
              render();
            </script>
          </body>
          </html>
          EOF

      - name: Install Capacitor Core & CLI
        run: |
          npm init -y
          npm install --save @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.minepulse.dgms",
            "appName": "MinePulse AI",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinePulse-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
