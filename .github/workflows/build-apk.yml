name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Image Generation Dependencies
        run: |
          pip install Pillow

      - name: Master Integration of All DGMS Modules
        run: |
          mkdir -p www
          python - << 'PYEOF'
          import sys

          try:
              from ui import DASHBOARD_HTML as html
          except Exception:
              from ui_part1 import PART1
              from ui_part2 import PART2
              from ui_part3 import PART3
              try:
                  from ui_map import PART_MAP
              except Exception:
                  PART_MAP = ""
              html = PART1 + PART_MAP + PART3 + PART2

          for token in ["MINEGUARD AI", "MineGuard AI", "MinePulse AI", "MinePulse", "MINEPULSE", "MINEGUARD"]:
              html = html.replace(token, "MineGuard")

          modules = [
              ("ui_sync", "SYNC_SCRIPT"),
              ("ui_navigation", "NAVIGATION_MODULE"),
              ("ui_handover", "HANDOVER_MODULE"),
              ("ui_alerts", "ALERTS_MODULE"),
              ("ui_pdf", "PDF_ENGINE_MODULE"),
              ("ui_muster", "MUSTER_MODULE"),
              ("ui_ventilation", "VENTILATION_MODULE"),
              ("ui_blasting", "BLASTING_MODULE"),
              ("ui_strata", "STRATA_MODULE"),
              ("ui_inundation", "INUNDATION_MODULE"),
              ("ui_machinery", "MACHINERY_MODULE"),
              ("ui_dust", "DUST_MODULE"),
              ("ui_fire", "FIRE_MODULE"),
              ("ui_electrical", "ELECTRICAL_MODULE"),
              ("ui_winding", "WINDING_MODULE"),
              ("ui_rescue", "RESCUE_MODULE"),
              ("ui_medical", "MEDICAL_MODULE"),
              ("ui_haulage", "HAULAGE_MODULE"),
              ("ui_smp", "SMP_MODULE"),
              ("ui_calibration", "CALIBRATION_MODULE"),
              ("ui_lamproom", "LAMPROOM_MODULE"),
              ("ui_voice", "VOICE_MODULE"),
              ("ui_backup", "BACKUP_MODULE"),
              ("ui_accident", "ACCIDENT_MODULE"),
              ("ui_sirdar_diary", "SIRDAR_DIARY_MODULE"),
              ("ui_simulator", "SIMULATOR_MODULE"),
              ("ui_auth", "AUTH_MODULE"),
              ("ui_attendance", "ATTENDANCE_MODULE"),
              ("ui_tracking", "TRACKING_MODULE"),
              ("ui_siren_network", "SIREN_NETWORK_MODULE"),
          ]

          integrated_scripts = ""
          for mod_name, var_name in modules:
              try:
                  mod = __import__(mod_name)
                  script_content = getattr(mod, var_name, "")
                  integrated_scripts += f"\n<!-- Module: {mod_name} -->\n{script_content}"
                  print(f"[OK] Integrated module: {mod_name}")
              except Exception as err:
                  print(f"[WARN] Module {mod_name} skipped: {err}")

          siren_engine = """
          <script>
          (function() {
              var audioCtx = null;
              var isSirenPlaying = false;
              var sirenOsc = null;
              var sirenGain = null;

              function getAudioContext() {
                  if (!audioCtx) {
                      var AudioClass = window.AudioContext || window.webkitAudioContext;
                      audioCtx = new AudioClass();
                  }
                  if (audioCtx.state === 'suspended') {
                      audioCtx.resume();
                  }
                  return audioCtx;
              }

              function unlockAudio() {
                  try {
                      var ctx = getAudioContext();
                      if (ctx.state === 'suspended') ctx.resume();
                      var b = ctx.createBuffer(1, 1, 22050);
                      var s = ctx.createBufferSource();
                      s.buffer = b;
                      s.connect(ctx.destination);
                      s.start(0);
                  } catch(e) {}
              }

              window.addEventListener('touchstart', unlockAudio, { once: true });
              window.addEventListener('click', unlockAudio, { once: true });

              window.playDGMSSiren = function(durationMs) {
                  durationMs = durationMs || 10000;
                  try {
                      var ctx = getAudioContext();
                      if (ctx.state === 'suspended') ctx.resume();
                      if (isSirenPlaying) return;
                      isSirenPlaying = true;

                      if (navigator.vibrate) {
                          navigator.vibrate([800, 200, 800, 200, 1200, 300, 1500]);
                      }

                      sirenOsc = ctx.createOscillator();
                      sirenGain = ctx.createGain();
                      sirenOsc.type = 'sawtooth';
                      sirenGain.gain.setValueAtTime(0.01, ctx.currentTime);
                      sirenGain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.3);

                      sirenOsc.connect(sirenGain);
                      sirenGain.connect(ctx.destination);

                      var t = ctx.currentTime;
                      sirenOsc.frequency.setValueAtTime(800, t);

                      var cycle = 2.5;
                      var totalCycles = Math.ceil(durationMs / 1000 / cycle);
                      for (var i = 0; i < totalCycles; i++) {
                          var start = t + (i * cycle);
                          sirenOsc.frequency.exponentialRampToValueAtTime(1200, start + (cycle * 0.6));
                          sirenOsc.frequency.exponentialRampToValueAtTime(800, start + cycle);
                      }

                      sirenOsc.start(t);
                      setTimeout(function() { window.stopDGMSSiren(); }, durationMs);
                  } catch(e) {}
              };

              window.stopDGMSSiren = function() {
                  if (!isSirenPlaying) return;
                  try {
                      if (sirenGain && audioCtx) {
                          sirenGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                          setTimeout(function() {
                              if (sirenOsc) { sirenOsc.stop(); sirenOsc.disconnect(); sirenOsc = null; }
                              isSirenPlaying = false;
                          }, 400);
                      } else {
                          if (sirenOsc) { sirenOsc.stop(); sirenOsc = null; }
                          isSirenPlaying = false;
                      }
                      if (navigator.vibrate) navigator.vibrate(0);
                  } catch(e) {
                      isSirenPlaying = false;
                  }
              };

              window.triggerAlarm = function() {
                  if (typeof window.triggerCollieryEvacuationSiren === 'function') {
                      window.triggerCollieryEvacuationSiren('General Colliery Hazard Detected');
                  } else {
                      window.playDGMSSiren(12000);
                  }
              };
          })();
          </script>
          """

          final_html = html.replace('</body>', integrated_scripts + siren_engine + '</body>')

          with open('www/index.html', 'w', encoding='utf-8') as f:
              f.write(final_html)

          print(f"[SUCCESS] Packaged www/index.html under brand name 'MineGuard' with {len(modules)} modules.")
          PYEOF

      - name: Configure Capacitor Android Engine
        run: |
          npm init -y
          npm install --save @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mineguard.dgms",
            "appName": "MineGuard",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1800,
                "launchAutoHide": true,
                "backgroundColor": "#0f172a",
                "androidSplashResourceName": "splash"
              }
            }
          }
          EOF
          npx cap add android

      - name: Inject Android Manifest Permissions (Camera, Flashlight & Network)
        run: |
          python - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
          """

          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", permissions + "\n    <application")
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[OK] Injected Hardware Camera & Torch Permissions into AndroidManifest.xml")
          PYEOF

      - name: Generate Custom Mining Hardhat Icons & Splash Screen
        run: |
          python - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          icon_size = 512
          icon = Image.new('RGBA', (icon_size, icon_size), (15, 23, 42, 255))
          draw = ImageDraw.Draw(icon)

          draw.ellipse([16, 16, 496, 496], outline=(245, 158, 11, 255), width=10)
          draw.ellipse([26, 26, 486, 486], outline=(56, 189, 248, 180), width=3)
          draw.chord([100, 110, 412, 390], start=180, end=360, fill=(245, 158, 11, 255), outline=(217, 119, 6, 255), width=6)
          draw.rounded_rectangle([236, 115, 276, 250], radius=8, fill=(251, 191, 36, 255))
          draw.rounded_rectangle([80, 250, 432, 290], radius=12, fill=(217, 119, 6, 255), outline=(180, 83, 9, 255), width=4)
          draw.rounded_rectangle([226, 215, 286, 252], radius=4, fill=(51, 65, 85, 255))
          draw.ellipse([216, 205, 296, 262], fill=(56, 189, 248, 255), outline=(255, 255, 255, 255), width=5)
          draw.ellipse([236, 218, 276, 248], fill=(255, 255, 255, 255))
          draw.rounded_rectangle([140, 340, 372, 386], radius=8, fill=(2, 132, 199, 255))
          draw.rectangle([140, 380, 372, 386], fill=(14, 165, 233, 255))

          os.makedirs("assets_gen", exist_ok=True)
          icon.save("assets_gen/icon_master.png")

          splash = Image.new('RGBA', (1080, 1920), (2, 6, 23, 255))
          splash_draw = ImageDraw.Draw(splash)
          icon_splash = icon.resize((480, 480), Image.Resampling.LANCZOS)
          splash.paste(icon_splash, (300, 680), icon_splash)
          splash_draw.line([(240, 1220), (840, 1220)], fill=(56, 189, 248, 160), width=4)
          splash_draw.line([(340, 1235), (740, 1235)], fill=(245, 158, 11, 200), width=2)
          splash.save("assets_gen/splash_master.png")

          res_dir = "android/app/src/main/res"
          density_map = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in density_map.items():
              target_dir = os.path.join(res_dir, folder)
              if os.path.exists(target_dir):
                  scaled_icon = icon.resize((size, size), Image.Resampling.LANCZOS)
                  scaled_icon.save(os.path.join(target_dir, "ic_launcher.png"))
                  scaled_icon.save(os.path.join(target_dir, "ic_launcher_round.png"))
                  scaled_icon.save(os.path.join(target_dir, "ic_launcher_foreground.png"))

          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file.lower() == "splash.png":
                      target_file = os.path.join(root, file)
                      try:
                          with Image.open(target_file) as current_splash:
                              w, h = current_splash.size
                          resized_splash = splash.resize((w, h), Image.Resampling.LANCZOS)
                          resized_splash.save(target_file)
                      except Exception:
                          splash.save(target_file)

          print("[SUCCESS] Assets configured.")
          PYEOF

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mineguard_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MineGuard@2026" \
            -keypass "MineGuard@2026" \
            -dname "CN=MineGuard Safety Systems, OU=Directorate General of Mines Safety, O=Ministry of Labour and Employment, L=Dhanbad, ST=Jharkhand, C=IN"

      - name: Compile Release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Align and Sign Production Release APK (V2/V3 Scheme)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL_APK="MineGuard-Production-Signed.apk"

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias mineguard_release \
            --ks-pass pass:"MineGuard@2026" \
            --key-pass pass:"MineGuard@2026" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          echo "[OK] Production APK successfully aligned and signed."

      - name: Upload Signed Production Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MineGuard-Production-Signed-APK
          path: MineGuard-Production-Signed.apk
