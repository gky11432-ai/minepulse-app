name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Real Dashboard with MINEGUARD AI Branding
        run: |
          mkdir -p www
          python - << 'PYEOF'
          # Repo ki real dashboard files import karein
          try:
              from ui import DASHBOARD_HTML as html
          except Exception:
              from ui_part1 import PART1
              from ui_part2 import PART2
              from ui_part3 import PART3
              try:
                  from ui_map import PART_MAP
              except Exception:
                  PART_MAP = ""
              html = PART1 + PART_MAP + PART3 + PART2

          # Naam update: MinePulse -> MINEGUARD AI
          html = html.replace("MinePulse AI", "MINEGUARD AI")
          html = html.replace("MinePulse", "MINEGUARD AI")
          html = html.replace("MINEPULSE", "MINEGUARD AI")

          # Cloud API URL routing
          html = html.replace("fetch('/api/", "fetch('https://minepulse-app.onrender.com/api/")
          html = html.replace('fetch("/api/', 'fetch("https://minepulse-app.onrender.com/api/')

          # 100% Offline DGMS Form-VI Report Generator Script
          offline_report_script = """
          <script>
          document.addEventListener('DOMContentLoaded', function() {
              setTimeout(bindOfflineReport, 1000);
          });

          function bindOfflineReport() {
              var btns = document.querySelectorAll('a, button');
              btns.forEach(function(btn) {
                  if (btn.textContent.includes('Print Form-VI') || (btn.href && btn.href.includes('form-vi'))) {
                      btn.removeAttribute('href');
                      btn.removeAttribute('target');
                      btn.style.cursor = 'pointer';
                      btn.onclick = function(e) {
                          if (e) e.preventDefault();
                          openOfflineFormVIModal();
                      };
                  }
              });
          }

          async function openOfflineFormVIModal() {
              var records = [];
              try {
                  if (typeof dbGetAll === 'function') records = await dbGetAll();
              } catch(e) {}

              if (!records || records.length === 0) {
                  try {
                      records = JSON.parse(localStorage.getItem('mine_logs') || localStorage.getItem('dgms_logs') || localStorage.getItem('minepulse_records') || '[]');
                  } catch(e) {}
              }

              var rows = '';
              if (!records || records.length === 0) {
                  rows = '<tr><td colspan="7" style="padding:14px; text-align:center; color:#64748b;">Local vault me koi inspection record nahi hai. Statutory form bhar kar save karein.</td></tr>';
              } else {
                  rows = records.map(function(r) {
                      var sev = r.severity || 'Normal';
                      var color = (sev.toLowerCase() === 'critical') ? '#dc2626' : '#16a34a';
                      return '<tr>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px;">' + (r.timestamp || new Date().toLocaleString()) + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px; font-weight:bold;">' + (r.mine_name || r.mine_id || 'Gevra Sector B (SECL)') + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px;">' + (r.officer_name || 'Inspector') + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px;">' + (r.category || 'CMR 153') + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px;">' + (r.notes || '') + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-size:11px; font-weight:bold; color:' + color + ';">' + sev + '</td>' +
                          '<td style="padding:8px; border:1px solid #94a3b8; font-family:monospace; font-size:9px;">' + ((r.sha256_hash || r.seal || 'SEAL').slice(0, 14)) + '...</td>' +
                      '</tr>';
                  }).join('');
              }

              var modal = document.createElement('div');
              modal.id = 'offline-report-screen';
              modal.style = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:#fff; color:#000; z-index:999999; overflow-y:auto; padding:16px; box-sizing:border-box; font-family:serif;';
              modal.innerHTML = 
                  '<div style="display:flex; justify-content:space-between; margin-bottom:12px;" class="no-print">' +
                      '<button onclick="document.getElementById(\\'offline-report-screen\\').remove()" style="padding:8px 14px; background:#475569; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">← Wapas Jayein</button>' +
                      '<button onclick="window.print()" style="padding:8px 18px; background:#000; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">🖨️ Print / Save PDF</button>' +
                  '</div>' +
                  '<div style="text-align:center; border-bottom:2px solid #000; padding-bottom:8px;">' +
                      '<h3 style="margin:0; font-size:15px; text-transform:uppercase;">Directorate General of Mines Safety (DGMS)</h3>' +
                      '<h4 style="margin:4px 0; font-size:13px;">FORM VI - STATUTORY REGISTER OF DAILY INSPECTIONS</h4>' +
                      '<p style="margin:2px 0; font-size:10px;">[Under Coal Mines Regulations, 2017 - Regulation 27 & 153]</p>' +
                  '</div>' +
                  '<table style="width:100%; border-collapse:collapse; margin-top:14px;">' +
                      '<thead><tr style="background:#f1f5f9;">' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Timestamp</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Mine Unit</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Officer</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Regulation</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Observations</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">Severity</th>' +
                          '<th style="border:1px solid #94a3b8; padding:8px; font-size:11px;">SHA-256 Seal</th>' +
                      '</tr></thead>' +
                      '<tbody>' + rows + '</tbody>' +
                  '</table>' +
                  '<div style="margin-top:35px; display:flex; justify-content:space-between; font-size:11px;">' +
                      '<div><b>Verified By:</b> MINEGUARD AI Autonomous Pit Engine</div>' +
                      '<div><b>Countersigned:</b> Colliery Manager / Agent</div>' +
                  '</div>';

              var old = document.getElementById('offline-report-screen');
              if (old) old.remove();
              document.body.appendChild(modal);
          }
          </script>
          """

          html = html.replace('</body>', offline_report_script + '</body>')

          with open('www/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PYEOF

      - name: Setup Capacitor Native Engine with MINEGUARD AI
        run: |
          npm init -y
          npm install --save @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mineguard.dgms",
            "appName": "MINEGUARD AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android

      - name: Build Standalone APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINEGUARD-AI-Offline-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
